version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "9000:9000"
      #- "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
      #- "3000:80"
    depends_on:
      - backend

  postgresql:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: rh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rh"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: